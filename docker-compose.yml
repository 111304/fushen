# ============================================================
#  星辰科技 - 全栈 Docker Compose 编排
#  服务: frontend (Nginx) + backend (FastAPI) + MySQL + Redis + MongoDB
#  使用方式:
#    开发环境启动:  docker compose up -d
#    重新构建镜像:  docker compose up -d --build
#    查看日志:      docker compose logs -f backend
#    停止并清理:    docker compose down
#  数据库连接配置(.env)已迁移到 db/.env；本文件中的 ${VAR:-默认值} 插值
#  默认与 db/.env 保持一致，如需自定义可运行: docker compose --env-file db/.env up
# ============================================================

services:
  # ======================== MySQL 8.0 ========================
  mysql:
    image: mysql:8.0.37
    container_name: stellar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-stellar_pass_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stellar_tech}
      TZ: Asia/Shanghai
    ports:
      # 仅绑定本机回环：公网不可访问，服务器上可用 SSH 隧道管理
      # 注意端口用 13306/16379 而非默认值：宝塔等面板常在宿主机自带 MySQL/Redis 占用默认端口
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-stellar_pass_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - stellar-net

  # ======================== Redis 7.2 ========================
  redis:
    image: redis:7.2.5-alpine
    container_name: stellar-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - stellar-net

  # ======================== MongoDB 7.0 ========================
  mongodb:
    image: mongo:7.0.12
    container_name: stellar-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-stellar_tech}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - stellar-net

  # ======================== Backend (FastAPI) ========================
  backend:
    build:
      # 因为独立 db 包位于项目根（与 backend 同级），构建上下文需改为项目根目录，
      # 才能把 backend 与 db 一起 COPY 进镜像。
      context: .
      dockerfile: backend/Dockerfile
    container_name: stellar-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      # MySQL — 指向 compose 内的 mysql 服务
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stellar_pass_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stellar_tech}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      # MongoDB
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_USER: ""
      MONGO_PASSWORD: ""
      MONGO_DATABASE: ${MONGO_DATABASE:-stellar_tech}
      # App
      APP_TITLE: "星辰科技公司网站API"
      APP_VERSION: "1.0.0"
      # uvicorn worker 数（Dockerfile CMD 不再写死 --workers，由此变量控制）
      WEB_CONCURRENCY: "4"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost"
      CACHE_TTL: "3600"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - stellar-net

  # ======================== Frontend (Nginx) ========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stellar-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - stellar-net

# ======================== 数据卷 ========================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  mongo_data:
    driver: local

# ======================== 网络 ========================
networks:
  stellar-net:
    driver: bridge
